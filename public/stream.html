<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobaStream Broadcaster Studio 🎙️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dash: #161210;
      --card-dash: #231C18;
      --accent: #E07A5F;
      --accent-matcha: #97A97C;
      --milk-tea: #E6CEB5;
      --border-dash: rgba(230, 206, 181, 0.15);
      --font-heading: 'Fredoka', cursive;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dash); color: #F5EFEB; font-family: var(--font-body); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #1C1613;
      border-bottom: 1px solid var(--border-dash);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-family: var(--font-heading); font-size: 1.4rem; color: var(--milk-tea); text-decoration: none; }
    .brand span { background: var(--accent); color: white; font-size: 0.75rem; padding: 0.2rem 0.55rem; border-radius: 999px; }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.25rem;
      padding: 1.25rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 992px) { .dash-grid { grid-template-columns: 1fr; } }

    .monitor-column { display: flex; flex-direction: column; gap: 1rem; }

    .stream-preview-box {
      background: #000;
      border-radius: 20px;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-dash);
    }

    #localVideo { width: 100%; height: 100%; object-fit: cover; }

    .telemetry-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .tele-card {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      padding: 0.9rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .tele-card span { font-size: 0.75rem; color: #A89B93; text-transform: uppercase; font-weight: 700; }
    .tele-card strong { font-size: 1.2rem; font-family: var(--font-heading); color: var(--milk-tea); }

    .customizer-card {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      padding: 1.25rem;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .customizer-card h3 { font-family: var(--font-heading); color: var(--milk-tea); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--milk-tea); }
    .form-group input, .form-group select {
      background: #181310;
      border: 1px solid var(--border-dash);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-body);
    }

    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .btn-action {
      background: var(--accent);
      color: white;
      border: none;
      font-family: var(--font-heading);
      font-weight: 600;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-secondary {
      background: #382C25;
      color: var(--milk-tea);
    }

    .chat-mod-panel {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 750px;
      overflow: hidden;
    }

    .chat-mod-header {
      padding: 1rem;
      background: #1A1412;
      border-bottom: 1px solid var(--border-dash);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-mod-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-msg { display: flex; gap: 0.6rem; font-size: 0.9rem; }
    .chat-author { font-size: 0.8rem; font-weight: 700; color: var(--milk-tea); margin-bottom: 0.15rem; }
    .chat-text { color: #E8DED8; word-break: break-word; }

    .chat-mod-footer {
      padding: 1rem;
      background: #1A1412;
      border-top: 1px solid var(--border-dash);
      display: flex;
      gap: 0.5rem;
    }

    .chat-mod-footer input {
      flex: 1;
      background: #2B221D;
      border: 1px solid var(--border-dash);
      border-radius: 999px;
      padding: 0.65rem 1rem;
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="stream.html" class="brand">
      🎙️ BobaStream <span>STUDIO</span>
    </a>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <a href="index.html" target="_blank" style="color: var(--milk-tea); font-size: 0.85rem; text-decoration: none; border: 1px solid var(--border-dash); padding: 0.4rem 0.8rem; border-radius: 999px;">
        👁️ Audience Lounge ↗
      </a>
    </div>
  </header>

  <main class="dash-grid">
    <section class="monitor-column">
      <div class="stream-preview-box">
        <video id="localVideo" autoplay playsinline muted></video>
        <div style="position: absolute; top: 1rem; left: 1rem; background: rgba(0,0,0,0.7); padding: 0.3rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight:700; color: var(--accent);" id="broadcastStatusBadge">
          ⚪ CAMERA OFFLINE
        </div>
      </div>

      <div class="telemetry-row">
        <div class="tele-card">
          <span>Active Viewers</span>
          <strong id="dashActiveViewers" style="color: var(--accent-matcha);">0</strong>
        </div>
        <div class="tele-card">
          <span>Camera Feed</span>
          <strong id="teleCamStatus" style="color: #A89B93;">Inactive</strong>
        </div>
        <div class="tele-card">
          <span>Global Taps</span>
          <strong id="dashTotalTaps">0</strong>
        </div>
        <div class="tele-card">
          <span>Ingest Type</span>
          <strong>Direct Cam</strong>
        </div>
      </div>

      <div class="customizer-card">
        <h3>🎨 Stream Title & Camera Settings</h3>
        
        <div class="form-grid">
          <div class="form-group">
            <label>Stream Title:</label>
            <input type="text" id="streamTitleInput" value="Tapioca Chill Room 🧋" placeholder="e.g. Midnight Boba & Chill Coding" />
          </div>
          <div class="form-group">
            <label>Host Display Name:</label>
            <input type="text" id="hostNameInput" value="Tim" placeholder="Your name / handle" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Sub-header Description:</label>
            <input type="text" id="streamSubtitleInput" value="Direct stream from OBS Virtual Camera" placeholder="Subtitle" />
          </div>
          <div class="form-group">
            <label>Select Camera / OBS Virtual Camera:</label>
            <select id="cameraDeviceSelect">
              <option value="">Detecting cameras...</option>
            </select>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-action" id="startCamBtn">📹 1. Start Camera Feed</button>
          <button class="btn-action btn-secondary" id="saveMetaBtn">💾 2. Update Stream Details</button>
        </div>
      </div>
    </section>

    <aside class="chat-mod-panel">
      <div class="chat-mod-header">
        <h3 style="font-family: var(--font-heading); font-size: 1.1rem;">Host Mod Chat</h3>
        <span style="font-size: 0.75rem; background: var(--accent); color: white; padding: 0.15rem 0.5rem; border-radius: 999px;">Host Mode</span>
      </div>
      <div class="chat-mod-body" id="dashChatBody"></div>
      <form class="chat-mod-footer" id="dashChatForm">
        <input type="text" id="dashMsgInput" placeholder="Chat as Host..." maxlength="200" autocomplete="off" />
        <button type="submit" class="btn-action" style="padding: 0.6rem 1.2rem; border-radius: 999px;">Send</button>
      </form>
    </aside>
  </main>

  <canvas id="captureCanvas" style="display:none;" width="640" height="360"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, doc, setDoc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDJz10JB1d7h7ul6tq_TfwEFkZi7M4ovy",
      authDomain: "bobastream-65561.firebaseapp.com",
      projectId: "bobastream-65561",
      storageBucket: "bobastream-65561.firebasestorage.app",
      messagingSenderId: "797280854987",
      appId: "1:797280854987:web:12d0c736b8deac49aab54e",
      measurementId: "G-N7E1XTMMTW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Active Viewers Counter ---
    onSnapshot(collection(db, "active_viewers"), (snap) => {
      document.getElementById('dashActiveViewers').textContent = snap.size || 0;
    });

    // --- Device Enumeration ---
    const camSelect = document.getElementById('cameraDeviceSelect');
    async function loadDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        camSelect.innerHTML = '';
        if (videoDevices.length === 0) {
          camSelect.innerHTML = '<option value="">No cameras detected</option>';
          return;
        }
        videoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `Camera ${idx + 1}`;
          camSelect.appendChild(opt);
        });
      } catch (e) {
        console.warn("Device enumeration error:", e);
      }
    }
    loadDevices();

    // --- Camera Handling ---
    const localVideo = document.getElementById('localVideo');
    const startCamBtn = document.getElementById('startCamBtn');
    const teleCamStatus = document.getElementById('teleCamStatus');
    const statusBadge = document.getElementById('broadcastStatusBadge');
    let currentStream = null;
    let broadcastInterval = null;

    startCamBtn.addEventListener('click', async () => {
      const deviceId = camSelect.value;
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : true,
        audio: false
      };

      try {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        localVideo.srcObject = currentStream;
        await loadDevices();

        teleCamStatus.textContent = "Live";
        teleCamStatus.style.color = "var(--accent-matcha)";
        statusBadge.textContent = "🔴 BROADCASTING LIVE";
        statusBadge.style.color = "#FFF";
        statusBadge.style.background = "var(--accent)";

        startBroadcastingFrames();
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    });

    const canvas = document.getElementById('captureCanvas');
    const ctx = canvas.getContext('2d');
    function startBroadcastingFrames() {
      if (broadcastInterval) clearInterval(broadcastInterval);
      broadcastInterval = setInterval(async () => {
        if (!currentStream || localVideo.readyState < 2) return;
        ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
        const frameData = canvas.toDataURL('image/jpeg', 0.5);

        try {
          await setDoc(doc(db, "stream_stats", "live_frame"), {
            frame: frameData,
            timestamp: Date.now()
          });
        } catch (e) {}
      }, 500);
    }

    // --- Metadata Update ---
    const streamTitleInput = document.getElementById('streamTitleInput');
    const hostNameInput = document.getElementById('hostNameInput');
    const streamSubtitleInput = document.getElementById('streamSubtitleInput');
    const saveMetaBtn = document.getElementById('saveMetaBtn');

    saveMetaBtn.addEventListener('click', async () => {
      const title = streamTitleInput.value.trim() || "Tapioca Chill Room 🧋";
      const host = hostNameInput.value.trim() || "Tim";
      const sub = streamSubtitleInput.value.trim() || "";

      try {
        await setDoc(doc(db, "stream_stats", "metadata"), {
          title: title,
          host: host,
          subtitle: sub,
          updatedAt: serverTimestamp()
        });
        alert("Stream details updated! Viewers see the changes immediately.");
      } catch (err) {
        alert("Failed to save details: " + err.message);
      }
    });

    // --- Chat & Telemetry ---
    const chatCol = collection(db, "chat_messages");
    const chatQuery = query(chatCol, orderBy("timestamp", "asc"), limit(50));
    const dashChatBody = document.getElementById('dashChatBody');
    const seen = new Set();

    onSnapshot(chatQuery, (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type === "added" && !seen.has(c.doc.id)) {
          seen.add(c.doc.id);
          const d = c.doc.data();
          const row = document.createElement('div');
          row.className = 'chat-msg';
          row.innerHTML = `
            <div style="font-size: 1.2rem;">${d.avatar || '🧋'}</div>
            <div>
              <div class="chat-author">${d.name} <span style="font-size: 0.65rem; background: ${d.badge === 'HOST' ? '#E07A5F' : '#3E3129'}; padding: 0.1rem 0.4rem; border-radius: 999px;">${d.badge}</span></div>
              <div class="chat-text">${d.text}</div>
            </div>
          `;
          dashChatBody.appendChild(row);
          dashChatBody.scrollTop = dashChatBody.scrollHeight;
        }
      });
    });

    const form = document.getElementById('dashChatForm');
    const input = document.getElementById('dashMsgInput');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;
      input.value = '';
      const currentHost = hostNameInput.value.trim() || "Tim";
      await addDoc(chatCol, {
        name: currentHost,
        text: txt,
        badge: "HOST",
        avatar: "🎙️",
        timestamp: serverTimestamp()
      });
    });

    onSnapshot(doc(db, "stream_stats", "reactions"), (snap) => {
      if (snap.exists()) {
        document.getElementById('dashTotalTaps').textContent = (snap.data().total || 0).toLocaleString();
      }
    });
  </script>
</body>
</html>
