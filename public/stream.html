<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobaStream Studio 🧋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Ably Realtime Client Library -->
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

  <style>
    :root {
      --bg-cream: #FFFDF9;
      --card-bg: #FFFFFF;
      --accent-tea: #C58940;
      --accent-tea-hover: #AF7630;
      --accent-boba: #3E2723;
      --accent-soft: #FBF4E9;
      --text-main: #2C2623;
      --text-muted: #8D7B68;
      --border-color: #EFE6DD;
      --shadow-sm: 0 2px 8px rgba(62, 39, 35, 0.04);
      --font-heading: 'Fredoka', cursive, sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-heading);
      font-size: 1.45rem;
      color: var(--accent-boba);
      text-decoration: none;
    }

    .studio-badge {
      background: #FFEBE6;
      color: #DE350B;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.25rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      background: var(--accent-tea);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.65rem 1.25rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease;
    }
    .btn:hover { background: var(--accent-tea-hover); }

    .btn-danger {
      background: #DE350B;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.65rem 1.25rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-danger:hover { background: #BF2600; }

    /* Studio Chat */
    .studio-chat-box {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .chat-head {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-foot {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      gap: 0.5rem;
    }

    .chat-foot input {
      flex: 1;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 0.6rem 0.85rem;
      outline: none;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="#" class="brand"><span>🧋</span> BobaStream</a>
      <span class="studio-badge">Host Studio</span>
    </div>
    <div>
      <a href="index.html" target="_blank" style="text-decoration: none; font-size: 0.85rem; font-weight: 700; color: var(--accent-tea);">Open Audience View ↗</a>
    </div>
  </header>

  <main class="main-grid">

    <!-- Controls Column -->
    <div style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="card">
        <h2 style="font-family: var(--font-heading); font-size: 1.25rem;">Host Moderation Tools</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Moderate your room live. Actions instantly push to all connected viewers over WebSockets.</p>
        <div>
          <button class="btn-danger" id="btnClearAllChat">🧹 Clear All Chat Messages</button>
        </div>
      </div>

      <div class="card">
        <h2 style="font-family: var(--font-heading); font-size: 1.25rem;">WebSocket Status</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted);">
          Connection: <strong id="ablyStatus" style="color: #2E7D32;">Connecting...</strong>
        </p>
        <p style="font-size: 0.85rem; color: var(--text-muted);">
          Room: <code>bobastream_lounge</code> | Limit: <strong>6,000,000 free msgs / mo</strong>
        </p>
      </div>
    </div>

    <!-- Live Stream Chat Column -->
    <div class="studio-chat-box">
      <div class="chat-head">
        <h3 style="font-family: var(--font-heading);">Studio Chat Feed</h3>
        <span style="font-size: 0.75rem; background: #E8F5E9; color: #2E7D32; padding: 0.2rem 0.5rem; border-radius: 999px; font-weight: 800;">Realtime</span>
      </div>

      <div class="chat-body" id="studioChatBody"></div>

      <div class="chat-foot">
        <input type="text" id="hostChatInput" placeholder="Speak as Host..." maxlength="200">
        <button class="btn" id="btnHostSend">Send</button>
      </div>
    </div>

  </main>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // --- Ably Studio Realtime Connection ---
    const ABLY_KEY = "zdFIEA.lFwawQ:3hO05NbdXIUZJ-K3BkyCIWT2RaeKz4fPg40qakSsc40";
    const ably = new Ably.Realtime({ key: ABLY_KEY });
    const chatChannel = ably.channels.get("bobastream_lounge");

    const ablyStatus = document.getElementById("ablyStatus");
    const studioChatBody = document.getElementById("studioChatBody");
    const hostChatInput = document.getElementById("hostChatInput");
    const btnHostSend = document.getElementById("btnHostSend");
    const btnClearAllChat = document.getElementById("btnClearAllChat");

    ably.connection.on("connected", () => {
      ablyStatus.innerText = "Online & Connected 🟢";
      ablyStatus.style.color = "#2E7D32";
    });

    ably.connection.on("failed", () => {
      ablyStatus.innerText = "Connection Failed 🔴";
      ablyStatus.style.color = "#DE350B";
    });

    // 1. Receive incoming messages
    chatChannel.subscribe("message", (msg) => {
      const data = msg.data;
      renderStudioMsg(data.name, data.text, data.badge, data.avatar);
      studioChatBody.scrollTop = studioChatBody.scrollHeight;
    });

    // 2. Clear Chat Listener
    chatChannel.subscribe("clear_chat", () => {
      studioChatBody.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem 0;">
          🧹 Chat cleared.
        </div>
      `;
    });

    function renderStudioMsg(name, text, badge, avatar) {
      const isHost = (badge === "Host" || badge === "HOST");
      const icon = avatar || (isHost ? '🧋' : '🍵');
      const div = document.createElement("div");
      div.style.cssText = "display: flex; gap: 0.5rem; font-size: 0.85rem; line-height: 1.3;";

      div.innerHTML = `
        <span>${icon}</span>
        <div>
          <strong>${escapeHtml(name)}</strong>
          ${isHost ? '<span style="color:#DE350B; font-weight:800; font-size:0.7rem;">[HOST]</span>' : ''}
          <div style="color: var(--text-main);">${escapeHtml(text)}</div>
        </div>
      `;
      studioChatBody.appendChild(div);
    }

    // 3. Host Send Message
    function sendHostMessage() {
      const text = hostChatInput.value.trim();
      if (!text) return;

      hostChatInput.value = "";
      chatChannel.publish("message", {
        name: "Host (Tim)",
        text: text,
        badge: "HOST",
        avatar: "🧋",
        timestamp: Date.now()
      });
    }

    btnHostSend.addEventListener("click", sendHostMessage);
    hostChatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendHostMessage();
    });

    // 4. Host Clear All Chat Button
    btnClearAllChat.addEventListener("click", () => {
      if (confirm("Clear chat messages for everyone in the lounge?")) {
        chatChannel.publish("clear_chat", { timestamp: Date.now() });
      }
    });
  </script>
</body>
</html>
