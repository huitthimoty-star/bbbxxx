<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobaStream Broadcaster Studio 🎙️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dash: #161210;
      --card-dash: #231C18;
      --accent: #E07A5F;
      --accent-matcha: #97A97C;
      --milk-tea: #E6CEB5;
      --border-dash: rgba(230, 206, 181, 0.15);
      --font-heading: 'Fredoka', cursive;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dash); color: #F5EFEB; font-family: var(--font-body); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #1C1613;
      border-bottom: 1px solid var(--border-dash);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-family: var(--font-heading); font-size: 1.4rem; color: var(--milk-tea); text-decoration: none; }
    .brand span { background: var(--accent); color: white; font-size: 0.75rem; padding: 0.2rem 0.55rem; border-radius: 999px; }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.25rem;
      padding: 1.25rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 992px) { .dash-grid { grid-template-columns: 1fr; } }

    .monitor-column { display: flex; flex-direction: column; gap: 1rem; }

    .stream-preview-box {
      background: #000;
      border-radius: 20px;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-dash);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #dashIframe, #dashVideo { width: 100%; height: 100%; border: none; display: none; }

    .monitor-placeholder {
      color: #7E7068;
      font-family: var(--font-heading);
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .telemetry-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .tele-card {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      padding: 0.9rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .tele-card span { font-size: 0.75rem; color: #A89B93; text-transform: uppercase; font-weight: 700; }
    .tele-card strong { font-size: 1.2rem; font-family: var(--font-heading); color: var(--milk-tea); }

    .customizer-card {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      padding: 1.25rem;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .customizer-card h3 { font-family: var(--font-heading); color: var(--milk-tea); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--milk-tea); }
    .form-group input {
      background: #181310;
      border: 1px solid var(--border-dash);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-body);
    }

    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .btn-action {
      background: var(--accent);
      color: white;
      border: none;
      font-family: var(--font-heading);
      font-weight: 600;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chat-mod-panel {
      background: var(--card-dash);
      border: 1px solid var(--border-dash);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 750px;
      overflow: hidden;
    }

    .chat-mod-header {
      padding: 1rem;
      background: #1A1412;
      border-bottom: 1px solid var(--border-dash);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-mod-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-msg { display: flex; gap: 0.6rem; font-size: 0.9rem; }
    .chat-author { font-size: 0.8rem; font-weight: 700; color: var(--milk-tea); margin-bottom: 0.15rem; }
    .chat-text { color: #E8DED8; word-break: break-word; }

    .chat-mod-footer {
      padding: 1rem;
      background: #1A1412;
      border-top: 1px solid var(--border-dash);
      display: flex;
      gap: 0.5rem;
    }

    .chat-mod-footer input {
      flex: 1;
      background: #2B221D;
      border: 1px solid var(--border-dash);
      border-radius: 999px;
      padding: 0.65rem 1rem;
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="stream.html" class="brand">
      🎙️ BobaStream <span>STUDIO</span>
    </a>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <a href="index.html" target="_blank" style="color: var(--milk-tea); font-size: 0.85rem; text-decoration: none; border: 1px solid var(--border-dash); padding: 0.4rem 0.8rem; border-radius: 999px;">
        👁️ Open Audience View ↗
      </a>
    </div>
  </header>

  <main class="dash-grid">
    <section class="monitor-column">
      <div class="stream-preview-box">
        <div class="monitor-placeholder" id="monitorPlaceholder">
          <span style="font-size:2rem;">📺</span>
          <span>Paste a link below to activate monitor</span>
        </div>
        <iframe id="dashIframe" allow="autoplay; camera; microphone; fullscreen; display-capture; picture-in-picture"></iframe>
        <video id="dashVideo" autoplay playsinline muted controls></video>
        <div style="position: absolute; top: 1rem; left: 1rem; background: rgba(0,0,0,0.7); padding: 0.3rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight:700; color: var(--accent);" id="broadcastStatusBadge">
          LIVE CONFIRMATION MONITOR
        </div>
      </div>

      <div class="telemetry-row">
        <div class="tele-card">
          <span>Active Viewers</span>
          <strong id="dashActiveViewers" style="color: var(--accent-matcha);">0</strong>
        </div>
        <div class="tele-card">
          <span>Feed Link Status</span>
          <strong id="teleFeedStatus" style="color: #A89B93;">Pending</strong>
        </div>
        <div class="tele-card">
          <span>Global Taps</span>
          <strong id="dashTotalTaps">0</strong>
        </div>
        <div class="tele-card">
          <span>Mode</span>
          <strong>Direct Link</strong>
        </div>
      </div>

      <div class="customizer-card">
        <h3>🔗 Live Stream Ingest & Details</h3>
        
        <div class="form-group">
          <label>Live Player / Embed Link (VDO.Ninja view link, HLS .m3u8, etc.):</label>
          <input type="text" id="streamUrlInput" placeholder="e.g. https://vdo.ninja/?view=bobastreamtim&autoplay=1" />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Stream Title:</label>
            <input type="text" id="streamTitleInput" value="Tapioca pearl Room 🧋" />
          </div>
          <div class="form-group">
            <label>Host Display Name:</label>
            <input type="text" id="hostNameInput" value="Tim" />
          </div>
        </div>

        <div class="form-group">
          <label>Sub-header Description:</label>
          <input type="text" id="streamSubtitleInput" value="Hi guys welcome to the website feel free to navigate kaya niyo na yan malaki na kayo" />
        </div>

        <div class="btn-row">
          <button class="btn-action" id="broadcastBtn">🚀 Broadcast Live to All Viewers</button>
        </div>
      </div>
    </section>

    <aside class="chat-mod-panel">
      <div class="chat-mod-header">
        <h3 style="font-family: var(--font-heading); font-size: 1.1rem;">Host Mod Chat</h3>
        <span style="font-size: 0.75rem; background: var(--accent); color: white; padding: 0.15rem 0.5rem; border-radius: 999px;">Host Mode</span>
      </div>
      <div class="chat-mod-body" id="dashChatBody"></div>
      <form class="chat-mod-footer" id="dashChatForm">
        <input type="text" id="dashMsgInput" placeholder="Chat as Host..." maxlength="200" autocomplete="off" />
        <button type="submit" class="btn-action" style="padding: 0.6rem 1.2rem; border-radius: 999px;">Send</button>
      </form>
    </aside>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, doc, setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDJz10JB1d7h7ul6tq_TfwEFkZi7M4ovy",
      authDomain: "bobastream-65561.firebaseapp.com",
      projectId: "bobastream-65561",
      storageBucket: "bobastream-65561.firebasestorage.app",
      messagingSenderId: "797280854987",
      appId: "1:797280854987:web:12d0c736b8deac49aab54e",
      measurementId: "G-N7E1XTMMTW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Active Viewers Counter
    onSnapshot(collection(db, "active_viewers"), (snap) => {
      document.getElementById('dashActiveViewers').textContent = snap.size || 0;
    });

    // Monitor Player
    const dashIframe = document.getElementById('dashIframe');
    const dashVideo = document.getElementById('dashVideo');
    const placeholder = document.getElementById('monitorPlaceholder');
    let dashHls = null;

    function renderPreview(url) {
      if (!url) return;
      placeholder.style.display = 'none';
      if (url.includes('.m3u8')) {
        dashIframe.style.display = 'none';
        dashVideo.style.display = 'block';
        if (Hls.isSupported()) {
          if (dashHls) dashHls.destroy();
          dashHls = new Hls();
          dashHls.loadSource(url);
          dashHls.attachMedia(dashVideo);
          dashHls.on(Hls.Events.MANIFEST_PARSED, () => dashVideo.play().catch(() => {}));
        } else if (dashVideo.canPlayType('application/vnd.apple.mpegurl')) {
          dashVideo.src = url;
          dashVideo.play().catch(() => {});
        }
      } else {
        dashVideo.style.display = 'none';
        dashIframe.style.display = 'block';
        dashIframe.src = url;
      }
    }

    // Load saved stream config if exists
    onSnapshot(doc(db, "stream_stats", "config"), (snap) => {
      if (snap.exists() && snap.data().streamUrl) {
        document.getElementById('streamUrlInput').value = snap.data().streamUrl;
        document.getElementById('teleFeedStatus').textContent = "Active";
        document.getElementById('teleFeedStatus').style.color = "var(--accent-matcha)";
        renderPreview(snap.data().streamUrl);
      }
    });

    // Broadcast Button handler
    const broadcastBtn = document.getElementById('broadcastBtn');
    const streamUrlInput = document.getElementById('streamUrlInput');
    const streamTitleInput = document.getElementById('streamTitleInput');
    const hostNameInput = document.getElementById('hostNameInput');
    const streamSubtitleInput = document.getElementById('streamSubtitleInput');

    broadcastBtn.addEventListener('click', async () => {
      const url = streamUrlInput.value.trim();
      const title = streamTitleInput.value.trim() || "Tapioca pearl Room 🧋";
      const host = hostNameInput.value.trim() || "Tim";
      const sub = streamSubtitleInput.value.trim() || "";

      if (!url) return alert("Please paste a live stream link (e.g. VDO.Ninja view link or .m3u8)");

      try {
        await setDoc(doc(db, "stream_stats", "config"), { streamUrl: url });
        await setDoc(doc(db, "stream_stats", "metadata"), {
          title: title,
          host: host,
          subtitle: sub,
          updatedAt: serverTimestamp()
        });

        renderPreview(url);
        document.getElementById('teleFeedStatus').textContent = "Active";
        document.getElementById('teleFeedStatus').style.color = "var(--accent-matcha)";
        alert("Broadcast live! All viewers on index.html are now watching this feed with audio.");
      } catch (err) {
        alert("Error saving: " + err.message);
      }
    });

    // Chat Sync
    const chatCol = collection(db, "chat_messages");
    const chatQuery = query(chatCol, orderBy("timestamp", "asc"), limit(50));
    const dashChatBody = document.getElementById('dashChatBody');
    const seen = new Set();

    onSnapshot(chatQuery, (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type === "added" && !seen.has(c.doc.id)) {
          seen.add(c.doc.id);
          const d = c.doc.data();
          const row = document.createElement('div');
          row.className = 'chat-msg';
          row.innerHTML = `
            <div style="font-size: 1.2rem;">${d.avatar || '🧋'}</div>
            <div>
              <div class="chat-author">${d.name} <span style="font-size: 0.65rem; background: ${d.badge === 'HOST' ? '#E07A5F' : '#3E3129'}; padding: 0.1rem 0.4rem; border-radius: 999px;">${d.badge}</span></div>
              <div class="chat-text">${d.text}</div>
            </div>
          `;
          dashChatBody.appendChild(row);
          dashChatBody.scrollTop = dashChatBody.scrollHeight;
        }
      });
    });

    const form = document.getElementById('dashChatForm');
    const input = document.getElementById('dashMsgInput');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;
      input.value = '';
      const currentHost = hostNameInput.value.trim() || "Tim";
      await addDoc(chatCol, {
        name: currentHost,
        text: txt,
        badge: "HOST",
        avatar: "🎙️",
        timestamp: serverTimestamp()
      });
    });

    onSnapshot(doc(db, "stream_stats", "reactions"), (snap) => {
      if (snap.exists()) {
        document.getElementById('dashTotalTaps').textContent = (snap.data().total || 0).toLocaleString();
      }
    });
  </script>
</body>
</html>
