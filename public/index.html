<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobaStream 🧋 Live Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-cream: #FAF6EE;
      --card-bg: #FFFFFF;
      --card-border: #EFE4D6;
      --accent: #E07A5F;
      --accent-hover: #D0694E;
      --boba-gold: #E29578;
      --boba-tea: #5C4B40;
      --text-muted: #8F8278;
      --font-heading: 'Fredoka', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-cream);
      color: var(--boba-tea);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand h1 { font-family: var(--font-heading); font-size: 1.6rem; color: var(--boba-tea); }
    .badge-live {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .main-grid {
      display: grid;
      grid-template-columns: 2.3fr 1fr;
      gap: 1.5rem;
      flex: 1;
    }
    @media (max-width: 992px) { .main-grid { grid-template-columns: 1fr; } }

    .player-col { display: flex; flex-direction: column; gap: 1.25rem; }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(92, 75, 64, 0.08);
    }
    .video-wrapper iframe, .video-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }

    .stream-overlay-pill {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .info-title { font-family: var(--font-heading); font-size: 1.35rem; color: var(--boba-tea); }
    .info-desc { font-size: 0.95rem; color: var(--text-muted); }

    .reactions-bar {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .btn-tap {
      background: var(--bg-cream);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-family: var(--font-heading);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: transform 0.08s, background 0.1s;
    }
    .btn-tap:active {
      transform: scale(0.92);
      background: #EFE4D6;
    }

    .floating-reaction {
      position: absolute;
      font-size: 1.8rem;
      pointer-events: none;
      z-index: 999;
      animation: floatUp 1.2s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-110px) scale(1.4) rotate(20deg); opacity: 0; }
    }

    .chat-col {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 720px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(92, 75, 64, 0.05);
    }

    .chat-head {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-head h3 { font-family: var(--font-heading); font-size: 1.15rem; }

    .user-profile-bar {
      padding: 0.5rem 1.25rem;
      background: #FDFBF7;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .btn-edit-profile {
      background: none;
      border: 1px solid var(--card-border);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--boba-tea);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .chat-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: #FDFBF7;
      padding: 0.65rem 0.85rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }
    .chat-item.is-host {
      background: #FFF5F2;
      border-color: #F8D1C7;
    }

    .user-avatar { font-size: 1.35rem; line-height: 1; }
    .user-tag {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--boba-tea);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .badge-label {
      background: var(--boba-tea);
      color: #fff;
      font-size: 0.65rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }
    .badge-label.host { background: var(--accent); }
    .msg-body {
      font-size: 0.9rem;
      color: #4A3E37;
      margin-top: 0.15rem;
      word-break: break-word;
    }

    .chat-input-box {
      padding: 0.85rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
    }
    .chat-input-box input {
      flex: 1;
      background: var(--bg-cream);
      border: 1px solid var(--card-border);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--boba-tea);
    }
    .chat-input-box button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 1.1rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modal for Name & Avatar Customization */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #fff;
      border-radius: 20px;
      padding: 1.5rem;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      font-size: 1.6rem;
      text-align: center;
    }
    .avatar-opt {
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 10px;
      border: 2px solid transparent;
    }
    .avatar-opt.selected {
      border-color: var(--accent);
      background: #FFF5F2;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.6rem;">🧋</span>
      <h1>BobaStream</h1>
      <span class="badge-live">LIVE</span>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">
      Enjoy the tea! ✨
    </div>
  </header>

  <div class="main-grid">
    <div class="player-col">
      <div class="video-wrapper">
        <div class="stream-overlay-pill">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#4EBA6F;"></span>
          <span id="viewerCountDisplay">1 Viewer</span>
        </div>

        <iframe id="liveIframePlayer" src="" style="display:none;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
        <video id="liveHlsVideo" controls autoplay playsinline style="display:none;"></video>
      </div>

      <div class="info-card">
        <h2 class="info-title" id="roomTitleDisplay">Tapioca Pearl Room 🧋</h2>
        <p class="info-desc" id="roomDescDisplay">Connecting to live feed...</p>
      </div>

      <div class="reactions-bar" id="reactionsContainer">
        <span style="font-size: 0.9rem; font-weight: 700; color: var(--text-muted);">Spam tap reactions! 🧋✨</span>
        <button id="btnTapSip" class="btn-tap">
          <span>🧋</span> <span id="tapCountDisplay">0</span> Chill Sips
        </button>
      </div>
    </div>

    <!-- Live Lounge Chat -->
    <div class="chat-col">
      <div class="chat-head">
        <h3>Boba Lounge Chat</h3>
        <span style="font-size: 0.75rem; background: #E8F5E9; color: #2E7D32; padding: 0.2rem 0.5rem; border-radius: 999px; font-weight: 700;">Active</span>
      </div>

      <div class="user-profile-bar">
        <div>Chatting as: <strong id="lblProfilePreview">🧋 ChillSipper</strong></div>
        <button class="btn-edit-profile" id="btnOpenModal">Change Name/Icon</button>
      </div>

      <div class="chat-body" id="audienceChatBody"></div>

      <div class="chat-input-box">
        <input type="text" id="audienceChatInput" placeholder="Send a message to the lounge..." maxlength="180">
        <button id="btnAudienceSend">Send</button>
      </div>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <h3 style="font-family: var(--font-heading); font-size: 1.2rem;">Choose Nickname & Icon</h3>
      
      <div>
        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Your Nickname:</label>
        <input type="text" id="modalNameInput" style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--card-border); margin-top: 0.25rem; font-family: var(--font-body);" maxlength="20">
      </div>

      <div>
        <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Choose Your Icon:</label>
        <div class="avatar-grid" id="avatarPickerGrid">
          <span class="avatar-opt">🧋</span>
          <span class="avatar-opt">🍵</span>
          <span class="avatar-opt">🍓</span>
          <span class="avatar-opt">✨</span>
          <span class="avatar-opt">🍡</span>
          <span class="avatar-opt">🌸</span>
          <span class="avatar-opt">🍧</span>
          <span class="avatar-opt">🧸</span>
          <span class="avatar-opt">🐱</span>
          <span class="avatar-opt">💖</span>
          <span class="avatar-opt">⭐</span>
          <span class="avatar-opt">☕</span>
        </div>
      </div>

      <button id="btnSaveProfile" style="background: var(--accent); color: white; border: none; padding: 0.75rem; border-radius: 10px; font-weight: 700; cursor: pointer;">Save Profile</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, limit, 
      serverTimestamp, doc, setDoc, deleteDoc, Timestamp, increment 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyB-SAMPLE-REPLACE_WITH_YOUR_KEY",
      authDomain: "bobastream-65561.firebaseapp.com",
      projectId: "bobastream-65561",
      storageBucket: "bobastream-65561.firebasestorage.app",
      messagingSenderId: "84729104829",
      appId: "1:84729104829:web:93a4cd2b948cf20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const liveIframePlayer = document.getElementById("liveIframePlayer");
    const liveHlsVideo = document.getElementById("liveHlsVideo");
    const roomTitleDisplay = document.getElementById("roomTitleDisplay");
    const roomDescDisplay = document.getElementById("roomDescDisplay");
    const viewerCountDisplay = document.getElementById("viewerCountDisplay");
    const tapCountDisplay = document.getElementById("tapCountDisplay");
    const btnTapSip = document.getElementById("btnTapSip");
    const reactionsContainer = document.getElementById("reactionsContainer");

    const audienceChatBody = document.getElementById("audienceChatBody");
    const audienceChatInput = document.getElementById("audienceChatInput");
    const btnAudienceSend = document.getElementById("btnAudienceSend");

    // Profile Modal Elements
    const profileModal = document.getElementById("profileModal");
    const btnOpenModal = document.getElementById("btnOpenModal");
    const btnSaveProfile = document.getElementById("btnSaveProfile");
    const modalNameInput = document.getElementById("modalNameInput");
    const avatarPickerGrid = document.getElementById("avatarPickerGrid");
    const lblProfilePreview = document.getElementById("lblProfilePreview");

    // --- User Profile (Name + Avatar) Management ---
    let myName = localStorage.getItem("boba_nick");
    let myAvatar = localStorage.getItem("boba_avatar") || "🧋";

    if (!myName) {
      const defaultNames = ["ChillSipper", "TaroFan", "MatchaLover", "OolongFriend", "BobaEnjoyer"];
      myName = defaultNames[Math.floor(Math.random() * defaultNames.length)] + Math.floor(Math.random() * 899 + 100);
      localStorage.setItem("boba_nick", myName);
      localStorage.setItem("boba_avatar", myAvatar);
    }
    updateProfileUI();

    function updateProfileUI() {
      lblProfilePreview.innerText = `${myAvatar} ${myName}`;
    }

    btnOpenModal.addEventListener("click", () => {
      modalNameInput.value = myName;
      document.querySelectorAll(".avatar-opt").forEach(el => {
        el.classList.toggle("selected", el.innerText === myAvatar);
      });
      profileModal.style.display = "flex";
    });

    avatarPickerGrid.addEventListener("click", (e) => {
      if (e.target.classList.contains("avatar-opt")) {
        document.querySelectorAll(".avatar-opt").forEach(el => el.classList.remove("selected"));
        e.target.classList.add("selected");
        myAvatar = e.target.innerText;
      }
    });

    btnSaveProfile.addEventListener("click", () => {
      const trimmed = modalNameInput.value.trim();
      if (trimmed) myName = trimmed;
      localStorage.setItem("boba_nick", myName);
      localStorage.setItem("boba_avatar", myAvatar);
      updateProfileUI();
      profileModal.style.display = "none";
    });

    profileModal.addEventListener("click", (e) => {
      if (e.target === profileModal) profileModal.style.display = "none";
    });

    // --- 1. Active Viewers Tracking ---
    const viewerDocId = "viewer_" + Math.random().toString(36).substring(2, 9);
    const viewerRef = doc(db, "active_viewers", viewerDocId);
    setDoc(viewerRef, { joinedAt: serverTimestamp() });
    window.addEventListener("beforeunload", () => deleteDoc(viewerRef));

    onSnapshot(collection(db, "active_viewers"), (snap) => {
      viewerCountDisplay.innerText = `${snap.size} ${snap.size === 1 ? 'Viewer' : 'Viewers'}`;
    });

    // --- 2. Live Stream Embed & Details ---
    let currentStreamUrl = "";
    onSnapshot(doc(db, "stream_stats", "main"), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (data.title) roomTitleDisplay.innerText = data.title;
        if (data.description) roomDescDisplay.innerText = data.description;
        if (data.taps !== undefined) tapCountDisplay.innerText = data.taps;

        if (data.activeUrl && data.activeUrl !== currentStreamUrl) {
          currentStreamUrl = data.activeUrl;
          loadVideoUrl(currentStreamUrl);
        }
      }
    });

    function loadVideoUrl(url) {
      if (url.includes(".m3u8")) {
        liveIframePlayer.style.display = "none";
        liveHlsVideo.style.display = "block";
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(liveHlsVideo);
        } else if (liveHlsVideo.canPlayType('application/vnd.apple.mpegurl')) {
          liveHlsVideo.src = url;
        }
      } else {
        liveHlsVideo.style.display = "none";
        liveIframePlayer.style.display = "block";
        liveIframePlayer.src = url;
      }
    }

    // --- 3. Chat System with 5-Minute Window & Instant Host Clear ---
    const fiveMinutesAgo = Timestamp.fromMillis(Date.now() - 5 * 60 * 1000);
    const chatQuery = query(
      collection(db, "chat_messages"),
      where("timestamp", ">=", fiveMinutesAgo),
      orderBy("timestamp", "asc"),
      limit(50)
    );

    const audienceMsgIds = new Set();

    onSnapshot(chatQuery, (snapshot) => {
      if (snapshot.empty) {
        audienceChatBody.innerHTML = "";
        audienceMsgIds.clear();
        return;
      }

      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        if (change.type === "added" && !audienceMsgIds.has(id)) {
          audienceMsgIds.add(id);
          const data = change.doc.data();
          renderAudienceMsg(id, data.name, data.text, data.badge, data.avatar);
        }
        if (change.type === "removed") {
          audienceMsgIds.delete(id);
          const elem = document.getElementById(`aud-msg-${id}`);
          if (elem) elem.remove();
        }
      });
      audienceChatBody.scrollTop = audienceChatBody.scrollHeight;
    });

    function renderAudienceMsg(id, name, text, badge, avatar) {
      const isHost = (badge === "Host" || badge === "HOST");
      const icon = avatar || (isHost ? '🧋' : '🍵');
      const div = document.createElement("div");
      div.className = `chat-item ${isHost ? 'is-host' : ''}`;
      div.id = `aud-msg-${id}`;

      div.innerHTML = `
        <span class="user-avatar">${icon}</span>
        <div style="flex: 1;">
          <div class="user-tag">
            <span>${escapeHtml(name)}</span>
            <span class="badge-label ${isHost ? 'host' : ''}">${escapeHtml(badge || 'Sipper')}</span>
          </div>
          <div class="msg-body">${escapeHtml(text)}</div>
        </div>
      `;
      audienceChatBody.appendChild(div);
    }

    async function sendChatMessage() {
      const msg = audienceChatInput.value.trim();
      if (!msg) return;

      audienceChatInput.value = "";
      await addDoc(collection(db, "chat_messages"), {
        name: myName,
        text: msg,
        badge: "Sipper",
        avatar: myAvatar,
        timestamp: serverTimestamp()
      });
    }

    btnAudienceSend.addEventListener("click", sendChatMessage);
    audienceChatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    // --- 4. Interactive Floating Tap Emojis ---
    const tapEmojis = ["🧋", "✨", "💖", "🍡", "🌸", "⭐", "🎉"];
    btnTapSip.addEventListener("click", async (e) => {
      // Spawn floating emoji animation
      const span = document.createElement("span");
      span.className = "floating-reaction";
      span.innerText = tapEmojis[Math.floor(Math.random() * tapEmojis.length)];
      
      const rect = btnTapSip.getBoundingClientRect();
      const parentRect = reactionsContainer.getBoundingClientRect();
      span.style.left = `${(rect.left - parentRect.left) + Math.random() * 60}px`;
      span.style.top = `0px`;

      reactionsContainer.appendChild(span);
      setTimeout(() => span.remove(), 1200);

      // Increment Firestore tap counter
      try {
        await setDoc(doc(db, "stream_stats", "main"), {
          taps: increment(1)
        }, { merge: true });
      } catch (err) {
        console.error("Tap increment error", err);
      }
    });

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
