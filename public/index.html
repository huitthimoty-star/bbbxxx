<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobaStream 🧋 Live Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Ably Realtime Client Library -->
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

  <style>
    :root {
      --bg-cream: #FFFDF9;
      --card-bg: #FFFFFF;
      --accent-tea: #C58940;
      --accent-tea-hover: #AF7630;
      --accent-boba: #3E2723;
      --accent-soft: #FBF4E9;
      --accent-green: #2E7D32;
      --text-main: #2C2623;
      --text-muted: #8D7B68;
      --border-color: #EFE6DD;
      --shadow-sm: 0 2px 8px rgba(62, 39, 35, 0.04);
      --shadow-md: 0 8px 24px rgba(62, 39, 35, 0.08);
      --font-heading: 'Fredoka', cursive, sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-heading);
      font-size: 1.45rem;
      color: var(--accent-boba);
      text-decoration: none;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-soft);
      padding: 0.25rem 0.35rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .nav-btn.active {
      background: var(--card-bg);
      color: var(--accent-tea);
      box-shadow: var(--shadow-sm);
    }

    .main-container {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .view-section { display: none; }
    .view-section.active { display: flex; flex: 1; flex-direction: column; }

    /* Live Layout */
    .live-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.25rem;
      flex: 1;
    }

    @media (max-width: 992px) {
      .live-layout { grid-template-columns: 1fr; }
    }

    .stream-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1.5px solid var(--border-color);
    }

    .video-wrapper iframe, .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .stream-meta-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .live-badge {
      background: #E8F5E9;
      color: var(--accent-green);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(46, 125, 50, 0.6);
    }

    /* Chat Layout */
    .chat-col {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 130px);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .chat-head {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-head h3 {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      color: var(--accent-boba);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-item {
      display: flex;
      gap: 0.6rem;
      font-size: 0.9rem;
      line-height: 1.35;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-avatar {
      font-size: 1.25rem;
      width: 32px;
      height: 32px;
      background: var(--accent-soft);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-tag {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .badge-label {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-tea);
    }

    .badge-label.host {
      background: #FFEBE6;
      color: #DE350B;
    }

    .msg-body {
      color: var(--text-main);
      word-break: break-word;
      margin-top: 0.15rem;
    }

    .chat-foot {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .user-config-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .avatar-select-btn {
      background: var(--accent-soft);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .nickname-input {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }

    .msg-input-row {
      display: flex;
      gap: 0.5rem;
    }

    .msg-input {
      flex: 1;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border 0.2s ease;
    }
    .msg-input:focus { border-color: var(--accent-tea); }

    .btn-send {
      background: var(--accent-tea);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 1.1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease;
    }
    .btn-send:hover { background: var(--accent-tea-hover); }

    /* Replay Shelf Layout */
    .replays-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .replay-player-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .replay-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .replay-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .replay-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-tea);
    }

    .replay-thumb {
      background: #2C2623;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #FFFDF9;
      font-size: 2.5rem;
    }

    .replay-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.75);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #fff;
    }

    .replay-details {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .replay-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .replay-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">
      <span>🧋</span> BobaStream
    </a>

    <div class="nav-tabs">
      <button class="nav-btn active" id="tabLive">🔴 Live Stream</button>
      <button class="nav-btn" id="tabReplays">🎬 Replays Archive</button>
    </div>
  </header>

  <main class="main-container">
    
    <!-- VIEW 1: LIVE BROADCAST -->
    <section class="view-section active" id="sectionLive">
      <div class="live-layout">
        
        <div class="stream-col">
          <div class="video-wrapper">
            <!-- Replace channel query with your current stream broadcast if embedding Twitch/Kick/YouTube live -->
            <iframe 
              src="https://player.twitch.tv/?channel=obobatea&parent=bblxxx.rea65048.workers.dev&parent=localhost&muted=false" 
              allowfullscreen>
            </iframe>
          </div>

          <div class="stream-meta-card">
            <div>
              <div class="live-badge"><span class="live-dot"></span> BROADCAST ACTIVE</div>
              <h1 style="font-family: var(--font-heading); font-size: 1.4rem; margin-top: 0.35rem;">Boba Lounge Broadcast 🧋</h1>
              <p style="font-size: 0.85rem; color: var(--text-muted);">Pull up a seat, order a milk tea, and hang out!</p>
            </div>
          </div>
        </div>

        <!-- Realtime WebSocket Chat Column -->
        <div class="chat-col">
          <div class="chat-head">
            <h3>Lounge Chat</h3>
            <span class="live-badge"><span class="live-dot"></span> Live chat</span>
          </div>

          <div class="chat-body" id="audienceChatBody"></div>

          <div class="chat-foot">
            <div class="user-config-row">
              <button class="avatar-select-btn" id="btnCycleAvatar" title="Change Avatar">🧋</button>
              <input type="text" class="nickname-input" id="inputNickname" placeholder="Your nickname" maxlength="20">
            </div>
            <div class="msg-input-row">
              <input type="text" class="msg-input" id="audienceChatInput" placeholder="Say something sweet..." maxlength="200">
              <button class="btn-send" id="btnAudienceSend">Send</button>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- VIEW 2: REPLAYS ARCHIVE -->
    <section class="view-section" id="sectionReplays">
      <div class="replays-container">
        
        <div class="replay-player-card">
          <h2 style="font-family: var(--font-heading); font-size: 1.35rem;" id="activeReplayTitle">🎬 PBB Live Replay</h2>
          <div class="video-wrapper">
            <iframe id="replayIframePlayer" src="" allow="autoplay; fullscreen; encrypted-media" style="display:none;"></iframe>
            <video id="replayNativeVideo" controls playsinline preload="metadata" style="display:none;"></video>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-muted);" id="activeReplayDesc">Select any recording below to watch.</p>
        </div>

        <div>
          <h3 style="font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 0.75rem;">Archived Broadcasts</h3>
          <div class="replay-grid" id="replayGridList"></div>
        </div>

      </div>
    </section>

  </main>

  <script>
    // --- 1. Top Navigation Switcher ---
    const tabLive = document.getElementById("tabLive");
    const tabReplays = document.getElementById("tabReplays");
    const sectionLive = document.getElementById("sectionLive");
    const sectionReplays = document.getElementById("sectionReplays");

    tabLive.addEventListener("click", () => {
      tabLive.classList.add("active");
      tabReplays.classList.remove("active");
      sectionLive.classList.add("active");
      sectionReplays.classList.remove("active");
    });

    tabReplays.addEventListener("click", () => {
      tabReplays.classList.add("active");
      tabLive.classList.remove("active");
      sectionReplays.classList.add("active");
      sectionLive.classList.remove("active");
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // --- 2. User Profile Setup ---
    const avatarList = ['🧋', '🍵', '🧃', '✨', '🍡', '🥞', '🧸', '🌸', '☕', '🍰'];
    let avatarIndex = 0;
    let myAvatar = localStorage.getItem("boba_avatar") || '🧋';
    let myName = localStorage.getItem("boba_nickname") || `Guest_${Math.floor(1000 + Math.random() * 9000)}`;

    const btnCycleAvatar = document.getElementById("btnCycleAvatar");
    const inputNickname = document.getElementById("inputNickname");

    btnCycleAvatar.innerText = myAvatar;
    inputNickname.value = myName;

    btnCycleAvatar.addEventListener("click", () => {
      avatarIndex = (avatarIndex + 1) % avatarList.length;
      myAvatar = avatarList[avatarIndex];
      btnCycleAvatar.innerText = myAvatar;
      localStorage.setItem("boba_avatar", myAvatar);
    });

    inputNickname.addEventListener("change", () => {
      const clean = inputNickname.value.trim();
      if (clean) {
        myName = clean;
        localStorage.setItem("boba_nickname", myName);
      }
    });

    // --- 3. Ably Realtime Chat Setup ---
    // Using your Root Key (6M messages/month free, 0 Firebase Reads)
    const ABLY_KEY = "zdFIEA.lFwawQ:3hO05NbdXIUZJ-K3BkyCIWT2RaeKz4fPg40qakSsc40";
    const ably = new Ably.Realtime({ key: ABLY_KEY });
    const chatChannel = ably.channels.get("bobastream_lounge");

    const audienceChatBody = document.getElementById("audienceChatBody");
    const audienceChatInput = document.getElementById("audienceChatInput");
    const btnAudienceSend = document.getElementById("btnAudienceSend");

    // Receive incoming live messages
    chatChannel.subscribe("message", (msg) => {
      const data = msg.data;
      renderAudienceMsg(msg.id, data.name, data.text, data.badge, data.avatar);
      audienceChatBody.scrollTop = audienceChatBody.scrollHeight;
    });

    // Receive host clear-chat signal
    chatChannel.subscribe("clear_chat", () => {
      audienceChatBody.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem 0;">
          🧹 Chat room was cleared by host.
        </div>
      `;
    });

    function renderAudienceMsg(id, name, text, badge, avatar) {
      const isHost = (badge === "Host" || badge === "HOST");
      const icon = avatar || (isHost ? '🧋' : '🍵');
      const div = document.createElement("div");
      div.className = `chat-item ${isHost ? 'is-host' : ''}`;
      div.id = `msg-${id}`;

      div.innerHTML = `
        <span class="user-avatar">${icon}</span>
        <div style="flex: 1;">
          <div class="user-tag">
            <span>${escapeHtml(name)}</span>
            <span class="badge-label ${isHost ? 'host' : ''}">${escapeHtml(badge || 'Sipper')}</span>
          </div>
          <div class="msg-body">${escapeHtml(text)}</div>
        </div>
      `;
      audienceChatBody.appendChild(div);
    }

    function sendChatMessage() {
      const text = audienceChatInput.value.trim();
      if (!text) return;

      audienceChatInput.value = "";
      chatChannel.publish("message", {
        name: myName,
        text: text,
        badge: "Sipper",
        avatar: myAvatar,
        timestamp: Date.now()
      });
    }

    btnAudienceSend.addEventListener("click", sendChatMessage);
    audienceChatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    // --- 4. Replays Shelf (Auto-Direct Dropbox Streaming Fix) ---
    const replayGridList = document.getElementById("replayGridList");
    const replayIframe = document.getElementById("replayIframePlayer");
    const replayNativeVideo = document.getElementById("replayNativeVideo");
    const activeReplayTitle = document.getElementById("activeReplayTitle");
    const activeReplayDesc = document.getElementById("activeReplayDesc");

    // Local array of replays (add more items or hook to a static JSON file anytime)
    const replaysData = [
      {
        title: "PBB Live Nov 6 Part 1 🧋",
        videoUrl: "https://www.dropbox.com/scl/fi/w7z2x69tvz9vehzeilzx3/Pbb-live-Nov-6-Part-1.mp4?rlkey=2w793wvd9lwjfn4076bh1eddd&st=t5yoeuvq&raw=1",
        meta: "Nov 6 • Part 1",
        desc: "Pinoy Big Brother Live broadcast recording session."
      }
    ];

    function playReplaySource(url, title, desc) {
      activeReplayTitle.innerText = title;
      activeReplayDesc.innerText = desc || "Recorded broadcast on BobaStream.";

      let cleanUrl = (url || "").trim();

      // Convert Dropbox links to pure raw streams
      if (cleanUrl.includes("dropbox.com")) {
        cleanUrl = cleanUrl.replace(/[?&]dl=0/, "").replace(/[?&]raw=1/, "");
        cleanUrl += cleanUrl.includes("?") ? "&raw=1" : "?raw=1";
      }

      // If direct MP4/Dropbox, use the native <video> tag so it streams instead of prompting download
      if (cleanUrl.includes(".mp4") || cleanUrl.includes("dropbox.com")) {
        replayIframe.style.display = "none";
        replayIframe.src = "";

        replayNativeVideo.style.display = "block";
        replayNativeVideo.src = cleanUrl;
        replayNativeVideo.load();
      } else {
        // Embed links (e.g. YouTube/Twitch VODs)
        replayNativeVideo.pause();
        replayNativeVideo.style.display = "none";
        replayNativeVideo.src = "";

        replayIframe.style.display = "block";
        replayIframe.src = cleanUrl;
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Render replay shelf
    replayGridList.innerHTML = "";
    replaysData.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "replay-card";
      card.innerHTML = `
        <div class="replay-thumb">
          <span>🧋</span>
          <span class="replay-duration">${escapeHtml(item.meta || 'VOD')}</span>
        </div>
        <div class="replay-details">
          <h4 class="replay-title">${escapeHtml(item.title)}</h4>
          <span class="replay-meta">${escapeHtml(item.desc || '')}</span>
        </div>
      `;

      card.addEventListener("click", () => {
        playReplaySource(item.videoUrl, item.title, item.desc);
      });

      if (index === 0) {
        playReplaySource(item.videoUrl, item.title, item.desc);
      }

      replayGridList.appendChild(card);
    });
  </script>
</body>
</html>
